<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ham's resume</title>
  <link rel="icon" type="image/jpeg" href="logo.jpg" />
  <style>
    * { box-sizing: border-box; }
    :root { color-scheme: dark; }
    html, body { margin: 0; width: 100%; min-height: 100%; font-family: "Segoe UI", Arial, sans-serif; color: #f7faff; }
    body { background: #061b29; overflow-x: hidden; }
    #aquariumBg { position: fixed; inset: 0; display: block; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
    body::before { content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background: linear-gradient(115deg, rgba(226,247,255,.07), transparent 30%, rgba(100,210,243,.025) 64%, transparent);
    }
    .resume-page { position: relative; z-index: 1; min-height: 100dvh; display: flex; flex-direction: column; }
    .top-bar { position: relative; z-index: 10; display: flex; align-items: center; justify-content: space-between;
      gap: 16px; padding: 16px max(22px, calc((100vw - 1020px) / 2));
      background: rgba(8,19,28,.40); border-bottom: 1px solid rgba(235,246,255,.26);
      -webkit-backdrop-filter: blur(24px) saturate(160%); backdrop-filter: blur(24px) saturate(160%);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.15), 0 8px 28px rgba(0,0,0,.20);
    }
    .top-bar a { color: #fff; text-decoration: none; font-weight: 900; font-size: 14px;
      letter-spacing: 1.1px; text-transform: uppercase; padding: 7px 4px;
      transition: color .2s ease, text-shadow .2s ease; }
    .top-bar a:hover, .top-bar a:focus-visible { color: #fff; text-shadow: 0 0 14px rgba(190,239,255,.95); }
    .top-bar a:focus-visible, .resume-fallback a:focus-visible { outline: 2px solid #fff; outline-offset: 4px; }
    .resume-container { width: min(1120px, calc(100% - 36px)); margin: 32px auto 46px; flex: 1;
      display: flex; flex-direction: column; min-height: 0; }
    .page-heading { display: flex; align-items: end; justify-content: space-between; flex-wrap: wrap; gap: 12px;
      padding: 0 4px 20px; }
    .page-heading h1 { margin: 0; color: white; font-family: Impact, "Arial Black", sans-serif;
      font-size: clamp(38px, 6vw, 70px); letter-spacing: .6px; line-height: 1;
      text-shadow: 3px 4px 0 #111622, 6px 6px 0 rgba(150,22,43,.82); }
    .page-heading p { margin: 0 0 3px; color: rgba(239,247,255,.72); font-size: 13px; font-weight: 700; }
    .resume-section { position: relative; display: flex; flex-direction: column; flex: 1; min-height: 620px;
      padding: 12px; border-radius: 24px; overflow: hidden;
      border: 1px solid rgba(237,246,255,.50);
      background: linear-gradient(125deg, rgba(230,245,255,.18), rgba(100,130,148,.07) 20%, rgba(11,27,39,.35) 75%, rgba(211,234,255,.11));
      box-shadow: inset 0 1px 1px rgba(255,255,255,.52), 0 22px 58px rgba(0,0,0,.38);
      -webkit-backdrop-filter: blur(26px) saturate(155%); backdrop-filter: blur(26px) saturate(155%);
    }
    .resume-section::before { content: ""; position: absolute; inset: 0; pointer-events: none;
      border-radius: inherit; background: radial-gradient(ellipse 50% 22% at 85% 0%, rgba(255,255,255,.16), transparent 85%); }
    .resume-frame { position: relative; display: block; width: 100%; height: min(78vh, 1000px); min-height: 540px;
      flex: 1; border: 0; border-radius: 15px; background: #fff; }
    .resume-fallback { position: relative; margin: 0; padding: 12px 9px 2px; color: rgba(245,251,255,.88);
      text-align: center; font-size: 13px; line-height: 1.5; }
    .resume-fallback a { color: #d6f3ff; font-weight: 900; text-decoration-thickness: 1px; text-underline-offset: 3px; }
    .resume-fallback a:hover { color: #fff; }
    @media (max-width: 650px) {
      .top-bar { padding: 13px 16px; }
      .top-bar a { font-size: 12px; }
      .resume-container { width: calc(100% - 22px); margin: 20px auto 24px; }
      .page-heading { padding-bottom: 16px; }
      .page-heading p { width: 100%; }
      .resume-section { padding: 7px; border-radius: 18px; min-height: 540px; }
      .resume-frame { border-radius: 12px; height: 70dvh; min-height: 450px; }
      .resume-fallback { font-size: 12px; }
    }
    @media (prefers-reduced-transparency: reduce) {
      .top-bar { background: #112430; }
      .resume-section { background: #1b3441; -webkit-backdrop-filter: none; backdrop-filter: none; }
    }
    @media (prefers-reduced-motion: reduce) { .top-bar a { transition: none; } }
  
    /* Aquarium glass overlay, matching the Joji theme without fish. */
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background: linear-gradient(105deg,
        rgba(235,255,255,.09) 0%,
        rgba(255,255,255,.015) 31%, transparent 47%,
        rgba(210,247,255,.06) 86%, rgba(255,255,255,.10) 100%);
      box-shadow: inset 0 0 85px rgba(145,229,255,.09), inset 0 0 14px rgba(255,255,255,.10);
    }
  </style>
</head>
<body>
  <canvas id="aquariumBg" aria-hidden="true"></canvas>
  <main class="resume-page">
    <nav class="top-bar" aria-label="Main navigation">
      <a href="index.html">&larr; ham's website</a>
      <a href="case-studies.html">case studies</a>
    </nav>
    <div class="resume-container">
      <header class="page-heading">
        <h1>My Resume</h1>
      </header>
      <section class="resume-section" aria-label="Resume preview">
        <iframe class="resume-frame" title="Hamilton Shea Resume"
          src="https://drive.google.com/file/d/1L1VTgCoLR2gVj2NFrdOt-CtLJlf3szyM/preview"
          allow="autoplay"></iframe>
        <p class="resume-fallback">If the resume does not load,
          <a href="https://drive.google.com/file/d/1L1VTgCoLR2gVj2NFrdOt-CtLJlf3szyM/view" target="_blank" rel="noopener noreferrer">open it here</a>.
        </p>
      </section>
    </div>
  </main>
  <audio id="hoverSound" src="hover.mp3" preload="auto"></audio>
  <audio id="clickSound" src="click.mp3" preload="auto"></audio>
  <script>
    const hoverSound = document.getElementById("hoverSound");
    const clickSound = document.getElementById("clickSound");
    const AUDIO_SCALE = .5;
    let audioReady = false;
    function primeAudio() {
      if (audioReady) return;
      audioReady = true;
      hoverSound.load();
      clickSound.load();
    }
    function playHoverSound() {
      primeAudio(); hoverSound.pause(); hoverSound.currentTime = 0;
      hoverSound.volume = .35 * AUDIO_SCALE;
      hoverSound.play().catch(() => {});
    }
    function playClickSound() {
      primeAudio(); clickSound.pause(); clickSound.currentTime = .06;
      clickSound.volume = .45 * AUDIO_SCALE; clickSound.playbackRate = 1.45;
      clickSound.play().catch(() => {});
    }
    document.querySelectorAll("a").forEach(link => {
      link.addEventListener("mouseenter", playHoverSound);
      link.addEventListener("click", playClickSound);
    });
    window.addEventListener("pointerdown", primeAudio, { once: true });
    window.addEventListener("keydown", primeAudio, { once: true });


    // Shared Joji aquarium animation, without the emoticons or fish.
    // Runs at 30 FPS with a reduced-resolution canvas for smooth performance.
    const aquariumBg = document.getElementById("aquariumBg");
    const aq = aquariumBg.getContext("2d", { alpha: false });
    const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
    const bubbles = Array.from({ length: 42 }, (_, i) => ({
      x: (i * .61803398875) % 1,
      y: (i * .3119) % 1,
      rad: 1.5 + (i % 4) * 1.2,
      speed: .014 + (i % 7) * .006,
      phase: i * 1.3
    }));
    let waterWidth = 1, waterHeight = 1, waterLast = 0;
    let waterGradient, waterFloorGradient, lightGlows;

    function resizeWater() {
      waterWidth = Math.max(1, window.innerWidth);
      waterHeight = Math.max(1, window.innerHeight);
      const dpr = Math.min(window.devicePixelRatio || 1, 1.25);
      aquariumBg.width = Math.round(waterWidth * dpr);
      aquariumBg.height = Math.round(waterHeight * dpr);
      aq.setTransform(dpr, 0, 0, dpr, 0, 0);
      waterGradient = aq.createLinearGradient(0, 0, 0, waterHeight);
      waterGradient.addColorStop(0, "#10394c");
      waterGradient.addColorStop(.4, "#092e40");
      waterGradient.addColorStop(1, "#031621");
      waterFloorGradient = aq.createLinearGradient(0, waterHeight * .72, 0, waterHeight);
      waterFloorGradient.addColorStop(0, "rgba(1,9,15,0)");
      waterFloorGradient.addColorStop(1, "rgba(1,9,15,.69)");
      lightGlows = [
        { x: .18, y: .03, radius: .5, alpha: .14 },
        { x: .82, y: .12, radius: .36, alpha: .08 }
      ].map(g => {
        const r = aq.createRadialGradient(waterWidth * g.x, waterHeight * g.y, 0,
          waterWidth * g.x, waterHeight * g.y, waterWidth * g.radius);
        r.addColorStop(0, `rgba(185,244,255,${g.alpha})`);
        r.addColorStop(1, "rgba(185,244,255,0)");
        return r;
      });
      waterLast = 0;
    }

    function drawWater(ms) {
      requestAnimationFrame(drawWater);
      if (document.hidden) { waterLast = 0; return; }
      if (reducedMotion.matches && waterLast) return;
      if (waterLast && ms - waterLast < 33.3) return;
      waterLast = ms;
      const c = aq, w = waterWidth, h = waterHeight, t = ms / 1000;
      c.fillStyle = waterGradient;
      c.fillRect(0, 0, w, h);
      c.save();
      for (const glow of lightGlows) {
        c.fillStyle = glow;
        c.fillRect(0, 0, w, h);
      }
      c.restore();

      // Original aquarium's layered, gently rolling water wave lines.
      c.save();
      c.globalAlpha = .13;
      c.lineWidth = 2;
      for (let i = 0; i < 20; i++) {
        const yy = h * (.02 + i * .05);
        c.strokeStyle = i % 2 ? "#8ee6ed" : "#bcffff";
        c.beginPath();
        for (let x = 0; x <= w + 18; x += 18) {
          const y = yy + Math.sin(x * .013 + t * .35 + i) * 10
            + Math.sin(x * .027 - t * .21 + i) * 5;
          if (x === 0) c.moveTo(x, y); else c.lineTo(x, y);
        }
        c.stroke();
      }
      c.restore();

      // Light passing through the surface and glinting off the glass.
      c.save();
      c.globalAlpha = .10;
      for (let i = 0; i < 5; i++) {
        const beamX = w * (.08 + i * .19) + Math.sin(t * .18 + i) * 22;
        const light = c.createLinearGradient(beamX, 0, beamX + 100, 0);
        light.addColorStop(0, "rgba(210,250,255,0)");
        light.addColorStop(.5, "rgba(210,250,255,.9)");
        light.addColorStop(1, "rgba(210,250,255,0)");
        c.fillStyle = light;
        c.fillRect(beamX, 0, 100, h * .75);
      }
      c.restore();

      // All the aquarium bubbles, but no swimming emoticons.
      c.save();
      c.strokeStyle = "rgba(210,250,255,.36)";
      c.lineWidth = 1.1;
      for (const b of bubbles) {
        const x = (b.x + Math.sin(t * .46 + b.phase) * .012) * w;
        const y = (((b.y - t * b.speed) % 1 + 1) % 1) * h;
        c.beginPath();
        c.arc(x, y, b.rad, 0, Math.PI * 2);
        c.stroke();
        c.fillStyle = "rgba(255,255,255,.45)";
        c.beginPath();
        c.arc(x - b.rad * .23, y - b.rad * .29, .65, 0, Math.PI * 2);
        c.fill();
      }
      c.restore();
      c.fillStyle = waterFloorGradient;
      c.fillRect(0, h * .72, w, h * .28);
    }
    resizeWater();
    window.addEventListener("resize", resizeWater);
    requestAnimationFrame(drawWater);

  </script>
</body>
</html>
