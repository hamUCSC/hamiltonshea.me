<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>ham's resume</title>
  <link rel="icon" type="image/jpeg" href="logo.jpg" />

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100vh;
      background: #050505;
      color: white;
      font-family: "Segoe UI", Arial, sans-serif;
      overflow: hidden;
    }

    .resume-page {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background:
        linear-gradient(
          90deg,
          rgba(180, 0, 0, 0.70),
          rgba(0, 0, 0, 0.92)
        ),
        #050505;
    }

    .top-bar {
      position: relative;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 22px;
      background: #000;
      border-bottom: 4px solid #d00000;
    }

    .top-bar a {
      color: white;
      text-decoration: none;
      font-family: Impact, "Arial Black", sans-serif;
      font-size: 20px;
      letter-spacing: 1px;
      text-transform: uppercase;
      transition: color 0.15s ease;
    }

    .top-bar a:hover {
      color: #ff8a8a;
    }

    .resume-section {
      min-height: 0;
      flex: 1;
      display: flex;
      flex-direction: column;
      background: white;
    }

    .resume-frame {
      width: 100%;
      min-height: 0;
      flex: 1;
      border: 0;
      background: white;
    }

    .resume-fallback {
      margin: 0;
      padding: 9px 12px;
      text-align: center;
      font-family: Arial, sans-serif;
      font-size: 13px;
      color: black;
      background: white;
      border-top: 1px solid #ddd;
    }

    .resume-fallback a {
      color: #d00000;
      font-weight: bold;
    }

    @media (max-width: 650px) {
      .top-bar {
        padding: 12px 14px;
      }

      .top-bar a {
        font-size: 15px;
      }

      .resume-fallback {
        font-size: 12px;
      }
    }
  </style>
</head>

<body>
  <main class="resume-page">
    <div class="top-bar">
      <a href="index.html">&larr; ham's website</a>
      <a href="case-studies.html">case studies</a>
    </div>

    <section class="resume-section">
      <iframe
        class="resume-frame"
        title="Hamilton Shea Resume"
        src="https://drive.google.com/file/d/1blLOPu8WSrju4m0HjqUsPqp4qERb0nql/preview"
        allow="autoplay"
      ></iframe>

      <p class="resume-fallback">
        If the resume does not load,
        <a
          href="https://drive.google.com/file/d/1blLOPu8WSrju4m0HjqUsPqp4qERb0nql/view"
          target="_blank"
          rel="noopener noreferrer"
        >
          open it here
        </a>.
      </p>
    </section>
  </main>

  <audio id="hoverSound" src="hover.mp3" preload="auto"></audio>
  <audio id="clickSound" src="click.mp3" preload="auto"></audio>

  <script>
    const hoverSound = document.getElementById("hoverSound");
    const clickSound = document.getElementById("clickSound");

    const AUDIO_SCALE = 0.5;
    const CLICK_RATE = 1.45;
    const CLICK_START_OFFSET = 0.06;

    let audioReady = false;

    function primeAudio() {
      if (audioReady) return;

      audioReady = true;
      hoverSound.load();
      clickSound.load();
    }

    function playHoverSound() {
      primeAudio();

      hoverSound.pause();
      hoverSound.currentTime = 0;
      hoverSound.volume = 0.35 * AUDIO_SCALE;

      hoverSound.play().catch(() => {});
    }

    function playClickSound() {
      primeAudio();

      clickSound.pause();
      clickSound.currentTime = CLICK_START_OFFSET;
      clickSound.volume = 0.45 * AUDIO_SCALE;
      clickSound.playbackRate = CLICK_RATE;

      clickSound.play().catch(() => {});
    }

    document.querySelectorAll("a").forEach((link) => {
      link.addEventListener("mouseenter", playHoverSound);
      link.addEventListener("click", playClickSound);
    });

    window.addEventListener("pointerdown", primeAudio, { once: true });
    window.addEventListener("keydown", primeAudio, { once: true });
  </script>
</body>
</html>
