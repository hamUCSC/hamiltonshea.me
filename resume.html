<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ham's resume</title>
  <style>
    * {
      box-sizing: border-box;
    }
    html, body {
      margin: 0;
      width: 100%;
      min-height: 100vh;
      background: #050505;
      color: white;
      font-family: "Segoe UI", Arial, sans-serif;
      overflow: hidden;
    }
    .resume-page {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background:
        linear-gradient(90deg, rgba(180,0,0,0.70), rgba(0,0,0,0.92)),
        #050505;
    }
    .top-bar {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 22px;
      background: #000;
      border-bottom: 4px solid #d00000;
    }
    .top-bar a {
      color: white;
      text-decoration: none;
      font-family: Impact, "Arial Black", sans-serif;
      font-size: 20px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .top-bar a:hover {
      color: #d00000;
    }
    .resume-section {
      flex: 1;
      background: white;
      display: flex;
      flex-direction: column;
    }
    .resume-frame {
      width: 100%;
      flex: 1;
      border: 0;
      background: white;
    }
    .resume-fallback {
      margin: 0;
      padding: 12px;
      text-align: center;
      font-family: Arial, sans-serif;
      background: white;
      color: black;
    }
    .resume-fallback a {
      color: #d00000;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <main class="resume-page">
    <div class="top-bar">
      <a href="index.html">&larr; ham's website</a>
      <a href="adaptive-menu-ui.html">case study</a>
    </div>
    <section class="resume-section">
      <iframe
        class="resume-frame"
        src="https://drive.google.com/file/d/1uPmXlt5iSdxCZ0-8CfSBMITQ8XCEeDnx/preview"
        allow="autoplay">
      </iframe>
      <p class="resume-fallback">
        If the resume does not load,
        <a href="https://drive.google.com/file/d/1uPmXlt5iSdxCZ0-8CfSBMITQ8XCEeDnx/view">
          open it here
        </a>.
      </p>
    </section>
  </main>
</body>
</html>
